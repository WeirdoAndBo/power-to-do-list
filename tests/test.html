<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power-Liste – Selbsttest</title>
<style>
 body{font:15px/1.5 system-ui,sans-serif;margin:0;padding:16px;background:#f4f5f7;color:#1c1f23}
 h1{font-size:22px;margin:0 0 6px}
 p{margin:4px 0 12px;color:#555}
 button{font:inherit;padding:8px 16px;border-radius:10px;border:0;background:#1c1f23;color:#fff;cursor:pointer}
 ol{padding-left:22px}
 li{margin:4px 0}
 .ok{color:#1f7a4d}.fail{color:#b3261e;font-weight:600}
 small{display:block;color:#b3261e;font-weight:400}
 #summary{font-weight:700;margin:12px 0}
 iframe{width:420px;max-width:100%;height:700px;border:1px solid #ccc;border-radius:12px;background:#fff;margin-top:12px}
</style>
</head>
<body>
<h1>Selbsttest der Power-Liste</h1>
<p>Klickt die App automatisch durch und prüft, ob alles noch so funktioniert wie vorher.
Deine eigene Liste wird vorher gesichert und danach wiederhergestellt.<br>
Start: im Projektordner <code>python3 -m http.server 8000</code>, dann <a href="http://localhost:8000/tests/test.html">localhost:8000/tests/test.html</a> öffnen.</p>
<button id="run">Test starten</button>
<div id="summary"></div>
<ol id="results"></ol>
<iframe id="app" title="App im Test"></iframe>
<script>
// Kein Werkzeug nötig: Dieser Test lädt die App in einen Rahmen (iframe) und bedient sie wie ein Mensch,
// indem er auf Knöpfe klickt. Nach jedem Schritt prüft er den gespeicherten Zustand und die Anzeige.
const KEY = 'powerliste-b-v1';
const frame = document.getElementById('app');
const results = document.getElementById('results');
let win, doc;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = sel => doc.querySelector(sel);
const $$ = sel => [...doc.querySelectorAll(sel)];
const saved = () => JSON.parse(win.localStorage.getItem(KEY));
const toastText = () => $('#toast').hidden ? '' : $('#toast').textContent;
const modalOpen = () => !$('#modal').hidden;
async function click(sel) {
 const el = typeof sel === 'string' ? $(sel) : sel;
 if (!el) throw new Error('Nicht gefunden: ' + sel);
 el.click();
 await sleep(60);
}
async function type(sel, text) {
 const el = $(sel);
 if (!el) throw new Error('Nicht gefunden: ' + sel);
 el.value = text;
 el.dispatchEvent(new Event('input', { bubbles: true }));
}
async function pressKey(el, key) {
 el.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
 await sleep(60);
}
function expect(cond, text) { if (!cond) throw new Error(text); }
const getTaskTitle = id => saved().tasks[id] && saved().tasks[id].t;
// Version C: Übersicht öffnen und den Schalter „Machbar“ an (true) oder aus (false) stellen
async function zeige(machbar) {
 await click('.switch [data-view="baum"]');
 const sw = $('.mswitch');
 if (!sw) throw new Error('Schalter „Machbar“ fehlt');
 if ((sw.getAttribute('aria-checked') === 'true') !== machbar) await click(sw);
}
async function loadApp() {
 frame.src = '../index.html?test=' + Date.now();
 await new Promise(r => frame.onload = r);
 win = frame.contentWindow;
 doc = frame.contentDocument;
 await sleep(100);
}
// Testdaten: eine feste Liste mit Zielen, Vorher-To-Dos, Backlog und Erledigtem.
// Animationen sind aus, damit der Test nicht warten muss.
function testData() {
 const now = Date.now();
 const shift = 4 * 60 * 60 * 1000; // Tag beginnt um 4 Uhr, wie in der App
 const midnight = new Date(now - shift); midnight.setHours(0, 0, 0, 0);
 const task = (id, title, extra = {}) => ({ id, t: title, needs: [], soft: [], done: false, goal: false, cat: null, prio: 0, created: now, doneAt: null, ...extra });
 const list = [
  task('g1', 'Stellen anschreiben für Kundenakquise', { goal: true, cat: 'arbeit', area: 'akq', needs: ['a', 'b'] }),
  task('a', 'Liste an Stellen anlegen', { needs: ['c', 'desk'] }),
  task('c', 'Ort festlegen, wo die Liste entsteht', { today: true }),
  task('b', 'Text überlegen', { soft: ['ex'] }),
  task('ex', 'Zwei Beispiel-Anschreiben ansehen'),
  task('g2', 'Newsletter starten', { goal: true, cat: 'arbeit', area: 'akq', needs: ['n1'], backlog: true }),
  task('n1', 'Thema der ersten Ausgabe festlegen', { backlog: true }),
  task('g5', 'Rechnungen für November schreiben', { goal: true, cat: 'arbeit', area: 'fin', needs: ['r1'] }),
  task('r1', 'Stunden aus dem Kalender zusammenzählen'),
  task('g8', 'Mails auf null bringen', { goal: true, cat: 'arbeit', area: 'orga' }),
  task('desk', 'Schreibtisch freiräumen'),
  task('g3', 'Keller entrümpeln', { goal: true, cat: 'privat', area: 'haus', needs: ['k1', 'k2'] }),
  task('k1', 'Sperrmüll-Termin holen', { today: true }),
  task('k2', 'Kisten besorgen', { done: true, doneAt: now - 864e5 }),
  task('g4', 'Ein Bild malen', { goal: true, cat: 'hobby', needs: ['desk', 'f1'] }),
  task('f1', 'Farben besorgen')
 ];
 const tasks = {};
 list.forEach(t => { tasks[t.id] = t; });
 return {
  name: 'Testliste', tasks,
  cats: [
   { id: 'arbeit', name: 'Arbeit', color: '#5b8def', subs: [{ id: 'akq', name: 'Akquise' }, { id: 'fin', name: 'Finanzen' }, { id: 'orga', name: 'Orga' }] },
   { id: 'privat', name: 'Privat', color: '#e0a03a', subs: [{ id: 'haus', name: 'Haushalt' }, { id: 'ges', name: 'Gesundheit' }] },
   { id: 'hobby', name: 'Hobby', color: '#9b7fd1', subs: [] }
  ],
  openCat: 'arbeit', view: 'jetzt', inbox: [], anim: false, day: midnight.getTime() + shift, format: 1
 };
}
// Lädt die App mit den Testdaten
async function freshApp() {
 localStorage.setItem(KEY, JSON.stringify(testData()));
 await loadApp();
}
// Eine Sicherungsdatei „hochladen“, als hätte man sie in der Dateiauswahl gewählt
async function importText(text, name = 'sicherung.json') {
 const input = $('#importFile');
 const transfer = new win.DataTransfer();
 transfer.items.add(new win.File([text], name, { type: 'application/json' }));
 input.files = transfer.files;
 input.dispatchEvent(new Event('change', { bubbles: true }));
 await sleep(150);
}

const tests = [];
const test = (name, fn) => tests.push({ name, fn });

test('Erster Start zeigt die Beispielkarte, zwei Tabs und Machbar an', async () => {
 localStorage.removeItem(KEY);
 await loadApp();
 expect($$('[data-view]').length === 2, 'Es gibt nicht zwei Tabs');
 expect($('.cat.open .mswitch[aria-checked="true"]'), 'Schalter „Machbar“ ist beim ersten Start nicht an');
 expect($('#acc .cat.open'), 'Kein Bereich aufgeklappt');
 expect($$('#acc .card').length > 0, 'Keine Karte in „Machbar“');
});
test('Testliste laden', async () => {
 await freshApp();
 expect($$('#acc .card').length > 3, 'Karten der Testliste fehlen');
 expect(saved().format === 1, 'Datenformat ist nicht 1');
});
test('Alte Daten aus dem Tab „Machbar“ öffnen die Übersicht mit Schalter an', async () => {
 expect($('[data-view="baum"]').getAttribute('aria-pressed') === 'true', 'Tab „Übersicht“ ist nicht gedrückt');
 expect($('.mswitch').getAttribute('aria-checked') === 'true', 'Schalter „Machbar“ ist nicht an');
 expect($('#acc .card') && !$('#acc .tree'), 'Es werden nicht die machbaren Karten gezeigt');
});
test('Übersicht und Heute wechseln, Schalter „Machbar“ an und aus', async () => {
 await click('[data-view="heute"]');
 expect($('#daylist'), 'Heute-Liste fehlt');
 expect(!$('.mswitch'), 'Schalter „Machbar“ darf in Heute nicht stehen');
 await click('[data-view="baum"]');
 expect($('.mswitch[aria-checked="true"]') && $('#acc .card'), 'Nach Heute ist der Schalter „Machbar“ nicht mehr an');
 await click('.mswitch');
 expect($('#acc .tree') && $('.mswitch').getAttribute('aria-checked') === 'false', 'Schalter aus zeigt nicht wieder alles');
 expect(saved().machbar === false && saved().view === 'baum', 'Schalter aus wurde nicht gespeichert');
 await click('[data-view="heute"]');
 await click('[data-view="baum"]');
 expect($('#acc .tree'), 'Nach Heute ist der Schalter „Machbar“ nicht mehr aus');
 await click('.mswitch');
 expect($('#acc .card') && !$('#acc .tree'), 'Schalter an zeigt nicht nur das Machbare');
});
test('Schalter „Machbar“ bleibt an, wenn man einen anderen Bereich aufklappt', async () => {
 await click('.catbar[data-cat="privat"]');
 expect($('.cat.open .mswitch[aria-checked="true"]'), 'Schalter ist im anderen Bereich nicht an');
 expect($('#acc .card[data-id="k1"]'), 'Machbare Karte in Privat fehlt');
 await click('.catbar[data-cat="arbeit"]');
});
test('Reihenfolge der Tabs: Übersicht, Heute', async () => {
 const order = $$('[data-view]').map(b => b.dataset.view).join(',');
 expect(order === 'baum,heute', 'Reihenfolge ist ' + order);
});
test('Kategorie-Navigation: alle Kategorien sichtbar, Klick springt zur Spalte', async () => {
 const tabs = $$('.subtabs .tab[data-i]');
 expect(tabs.length === 3, 'Nicht alle drei Kategorien als Knopf da');
 expect(tabs.every(t => t.offsetParent !== null), 'Ein Kategorie-Knopf ist versteckt');
 const nav = $('.subtabs');
 expect(nav.scrollWidth <= nav.clientWidth + 1, 'Kategorie-Knöpfe ragen seitlich heraus statt umzubrechen');
 await click(tabs[2]);
 expect(tabs[2].getAttribute('aria-current') === 'true', 'Geklickte Kategorie ist nicht markiert');
 const cols = $('#cols');
 const column = cols.children[2];
 expect(column.classList.contains('jump'), 'Spalte leuchtet nicht auf');
 const visible = column.getBoundingClientRect().left < cols.getBoundingClientRect().right - 20;
 expect(visible, 'Zur Spalte wurde nicht gesprungen');
 await click(tabs[0]);
 await sleep(150);
 expect(cols.scrollLeft < 5, 'Zurück zur ersten Spalte ging nicht');
});
test('Popup „Neues To-Do“ wie eine Karte: Titel, Unter-To-Dos mit Enter und Tab', async () => {
 const before = Object.keys(saved().tasks).length;
 await click('.dock .plus');
 expect(modalOpen(), 'Popup ging nicht auf');
 expect($('#modal [data-pick=cat]') && $('#modal [name=bl]'), 'Bereich/Kategorie oder „Erst mal ins Backlog“ fehlt');
 expect(!$('#modal [name=what]'), 'Auswahl Ziel/Unter-To-Do soll weg sein');
 await type('#modal [name=text]', 'Test-Ziel');
 await pressKey($('#modal [name=text]'), 'Enter');
 const rowInput = n => $$('#modal .nrow input')[n];
 expect(rowInput(0) && doc.activeElement === rowInput(0), 'Enter im Titel öffnet keine Unter-To-Do-Zeile');
 rowInput(0).value = 'Schritt A';
 await pressKey(rowInput(0), 'Enter');
 rowInput(1).value = 'Schritt B';
 await pressKey(rowInput(1), 'Enter');
 rowInput(2).value = 'Vor B';
 await pressKey(rowInput(2), 'Tab');
 expect($$('#modal .nrow')[2].dataset.l === '1', 'Tab rückt nicht ein');
 await pressKey(rowInput(2), 'Enter');
 await pressKey(rowInput(3), 'Enter');   // leere Zeile + Enter = anlegen
 expect(!modalOpen(), 'Enter in leerer Zeile legt nicht an');
 const tasks = Object.values(saved().tasks);
 expect(tasks.length === before + 4, 'Es wurden nicht genau 4 To-Dos angelegt');
 const goal = tasks.find(t => t.t === 'Test-Ziel');
 const b = tasks.find(t => t.t === 'Schritt B');
 expect(goal && goal.needs.length === 2 && b.needs.length === 1 && getTaskTitle(b.needs[0]) === 'Vor B', 'Aufbau stimmt nicht');
 expect(toastText().includes('mit 3 Unter-To-Dos'), 'Hinweis „mit 3 Unter-To-Dos“ fehlt');
});
test('Rückgängig nimmt das Anlegen zurück', async () => {
 await click('#undo');
 expect(!Object.values(saved().tasks).some(t => t.t === 'Test-Ziel'), 'Ziel ist noch da');
});
test('Abhaken, „Cool, geschafft!“ und wieder öffnen', async () => {
 await click('.card[data-id="c"] .check');
 expect(saved().tasks.c.done, '„c“ ist nicht erledigt');
 await click('.card[data-id="desk"] .check');
 expect(modalOpen() && $('#modal').textContent.includes('Cool, geschafft'), 'Frage „Jetzt machen?“ kam nicht');
 await click('#modal [data-v="later"]');
 expect(saved().tasks.desk.done, '„desk“ ist nicht erledigt');
 await click('#undo');
 expect(!saved().tasks.desk.done, 'Rückgängig hat „desk“ nicht wieder geöffnet');
});
test('Heute-Schalter nimmt offene Vorher-To-Dos mit', async () => {
 await click('.card[data-id="b"] [data-act="today"]');
 const s = saved();
 expect(s.tasks.b.today, '„b“ ist nicht in Heute');
 expect(s.tasks.ex.today && s.tasks.ex.todayBy === 'b', 'Vorher-To-Do „ex“ wurde nicht mitgenommen');

});

 const grip = $('#daylist .card .cgrip');
 grip.focus();
 await pressKey(grip, 'ArrowDown');
 expect($('#daylist .card').dataset.id !== first, 'Reihenfolge hat sich nicht geändert');

test('Heute-Schalter aus nimmt Mitgenommene wieder raus', async () => {
 await zeige(true);
 await click('.card[data-id="b"] [data-act="today"]');
 expect(!saved().tasks.ex.today, '„ex“ ist noch in Heute');
});
test('Ins Backlog verschieben und zurück', async () => {
 await click('.card[data-id="b"] [data-act="move"]');
 $('#modal [name=bl][value="1"]').checked = true;
 await click('#modal [data-v="ok"]');
 expect(modalOpen(), 'Frage „ganze Kette?“ kam nicht');
 await click('#modal [data-v="one"]');
 expect(saved().tasks.b.backlog, '„b“ ist nicht im Backlog');
 // Version C: Backlog ist ein eigener Abschnitt mit denselben Karten; zurück nach Zeitnah per Ziehen
 const card = $('.col[aria-label="Akquise"] details.blsec .card[data-id="b"]');
 expect(card && $('.col[aria-label="Akquise"] details.blsec').open, '„b“ steht nicht als Karte im offenen Backlog-Abschnitt');
 const top = $('.col[aria-label="Akquise"] .list.zone[data-bl="0"] > .card').getBoundingClientRect();
 await dragTo(card.querySelector('.ctext'), top.x + 40, top.y + 8);
 expect(!saved().tasks.b.backlog, '„b“ ist nicht zurück in Zeitnah');
});
test('Löschen mit Rückgängig', async () => {

 await click('.ins[data-act="insroot"][data-cat="arbeit"][data-area="fin"][data-bl="0"][data-after=""]');

 input.value = 'Neu in Finanzen';
 await pressKey(input, 'Enter');
 if ($('.insrowroot .tinput')) await pressKey($('.insrowroot .tinput'), 'Escape');

test('Übersicht: Unter-To-Dos mit Pfeiltasten umsortieren und einrücken', async () => {
 await click('.tree li[data-tid="g1"] > .chead .cardtog');
 let grip = $('.tree li[data-tid="b"] > .row .tgrip');
 expect(grip, 'Griff am Unter-To-Do fehlt');
 expect(!$('.tree li[data-tid="g1"] > .row .tgrip'), 'Ziel ganz oben darf keinen Griff haben');
 grip.focus();
 await pressKey(grip, 'ArrowUp');
 expect(saved().tasks.g1.needs.join() === 'b,a', 'Reihenfolge ist nicht „b, a“');

test('Übersicht: Unter-To-Do per Ziehen nach oben verschieben (anfassen, wo man will)', async () => {
 const grip = $('.tree li[data-tid="a"] > .row .tw');
 const target = $('.tree li[data-tid="b"] > .row').getBoundingClientRect();
 const from = grip.getBoundingClientRect();
 const pointer = (type, x, y) => grip.dispatchEvent(new win.PointerEvent(type, { bubbles: true, clientX: x, clientY: y, pointerId: 1, pointerType: 'mouse' }));
 pointer('pointerdown', from.x + 5, from.y + 5);
 const move = (x, y) => win.dispatchEvent(new win.PointerEvent('pointermove', { bubbles: true, clientX: x, clientY: y, pointerId: 1 }));
 move(from.x + 5, from.y - 10);
 move(from.x + 5, target.top + 4);
 win.dispatchEvent(new win.PointerEvent('pointerup', { bubbles: true, clientX: from.x + 5, clientY: target.top + 4, pointerId: 1 }));
 await sleep(60);
 expect(saved().tasks.g1.needs.join() === 'a,b', 'Reihenfolge ist nach dem Ziehen nicht „a, b“');
 await sleep(400); // direkt nach dem Ziehen ignoriert die App Klicks kurz
 await zeige(true);
});
// Zieht ein Element am Griff zu (x, y) – wie mit Maus oder Finger
async function dragTo(grip, x, y) {
 const from = grip.getBoundingClientRect();
 const at = (type, px, py, target = win) => target.dispatchEvent(new win.PointerEvent(type, { bubbles: true, clientX: px, clientY: py, pointerId: 1, pointerType: 'mouse' }));
 at('pointerdown', from.x + 5, from.y + 5, grip);
 at('pointermove', from.x + 5, from.y + 20);
 at('pointermove', x, y);
 at('pointerup', x, y);
 await sleep(400); // direkt nach dem Ziehen ignoriert die App Klicks kurz
}

});

document.getElementById('run').onclick = async () => {
 const own = localStorage.getItem(KEY); // eigene Liste sichern
 results.innerHTML = '';
 let failed = 0;
 try {
  for (const t of tests) {
   const li = document.createElement('li');
   results.append(li);
   try {
    await t.fn();
    li.className = 'ok';
    li.textContent = '✓ ' + t.name;
   } catch (e) {
    failed++;
    li.className = 'fail';
    li.innerHTML = '✗ ' + t.name + '<small></small>';
    li.querySelector('small').textContent = e.message;
   }
  }
 } finally {
  frame.src = 'about:blank';
  await sleep(100);
  if (own === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, own); // eigene Liste zurück
 }
 const summary = document.getElementById('summary');
 summary.textContent = failed ? `${failed} von ${tests.length} Tests fehlgeschlagen.` : `Alle ${tests.length} Tests bestanden.`;
 summary.className = failed ? 'fail' : 'ok';
};
</script>
