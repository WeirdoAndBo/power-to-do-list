<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power-Liste – Selbsttest</title>
<style>
 body{font:15px/1.5 system-ui,sans-serif;margin:0;padding:16px;background:#f4f5f7;color:#1c1f23}
 h1{font-size:22px;margin:0 0 6px}
 p{margin:4px 0 12px;color:#555}
 button{font:inherit;padding:8px 16px;border-radius:10px;border:0;background:#1c1f23;color:#fff;cursor:pointer}
 ol{padding-left:22px}
 li{margin:4px 0}
 .ok{color:#1f7a4d}.fail{color:#b3261e;font-weight:600}
 small{display:block;color:#b3261e;font-weight:400}
 #summary{font-weight:700;margin:12px 0}
 iframe{width:640px;max-width:100%;height:700px;border:1px solid #ccc;border-radius:12px;background:#fff;margin-top:12px}
</style>
</head>
<body>
<h1>Selbsttest der Power-Liste</h1>
<p>Klickt die App automatisch durch und prüft, ob alles noch so funktioniert wie vorher.
Deine eigene Liste wird vorher gesichert und danach wiederhergestellt.<br>
Start: im Projektordner <code>python3 -m http.server 8000</code>, dann <a href="http://localhost:8000/tests/test.html">localhost:8000/tests/test.html</a> öffnen.</p>
<button id="run">Test starten</button>
<div id="summary"></div>
<ol id="results"></ol>
<iframe id="app" title="App im Test"></iframe>
<script>
// Kein Werkzeug nötig: Dieser Test lädt die App in einen Rahmen (iframe) und bedient sie wie ein Mensch,
// indem er auf Knöpfe klickt. Nach jedem Schritt prüft er den gespeicherten Zustand und die Anzeige.
const KEY = 'powerliste-b-v1';
const frame = document.getElementById('app');
const results = document.getElementById('results');
let win, doc;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = sel => doc.querySelector(sel);
const $$ = sel => [...doc.querySelectorAll(sel)];
const saved = () => JSON.parse(win.localStorage.getItem(KEY));
const toastText = () => $('#toast').hidden ? '' : $('#toast').textContent;
const modalOpen = () => !$('#modal').hidden;
async function click(sel) {
 const el = typeof sel === 'string' ? $(sel) : sel;
 if (!el) throw new Error('Nicht gefunden: ' + sel);
 el.click();
 await sleep(60);
}
// 1.0.47: Titel und Listenpunkte werden erst beim zweiten Antippen bearbeitet
async function dblclick(sel) {
 const el = typeof sel === 'string' ? $(sel) : sel;
 if (!el) throw new Error('Nicht gefunden: ' + sel);
 el.click();
 el.click();
 await sleep(60);
}
// Übersicht mit aufgeklapptem Ziel g1 (Unter-To-Dos sichtbar)
async function zeigeG1Offen() {
 await zeige(false);
 const toggle = $('.tree li.card[data-id="g1"] > .chead .cardtog');
 if (toggle.getAttribute('aria-expanded') !== 'true') await click(toggle);
}
async function type(sel, text) {
 const el = $(sel);
 if (!el) throw new Error('Nicht gefunden: ' + sel);
 el.value = text;
 el.dispatchEvent(new Event('input', { bubbles: true }));
}
async function pressKey(el, key) {
 el.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
 await sleep(60);
}
function expect(cond, text) { if (!cond) throw new Error(text); }
const getTaskTitle = id => saved().tasks[id] && saved().tasks[id].t;
// Anlegen zeigt keinen Rückgängig-Knopf mehr (1.0.39). Zum Aufräumen im Test direkt zurücknehmen.
async function undoLast() { win.eval('undoLast()'); await sleep(60); }
// Version C: Übersicht öffnen und den Schalter „Machbar“ an (true) oder aus (false) stellen
async function zeige(machbar) {
 await click('.switch [data-view="baum"]');
 const sw = $('.mswitch');
 if (!sw) throw new Error('Schalter „Machbar“ fehlt');
 if ((sw.getAttribute('aria-checked') === 'true') !== machbar) await click(sw);
}
async function loadApp() {
 frame.src = '../index.html?test=' + Date.now();
 await new Promise(r => frame.onload = r);
 win = frame.contentWindow;
 doc = frame.contentDocument;
 await sleep(100);
}
// Testdaten: eine feste Liste mit Zielen, Vorher-To-Dos, Backlog und Erledigtem.
// Animationen sind aus, damit der Test nicht warten muss.
function testData() {
 const now = Date.now();
 const shift = 4 * 60 * 60 * 1000; // Tag beginnt um 4 Uhr, wie in der App
 const midnight = new Date(now - shift); midnight.setHours(0, 0, 0, 0);
 const task = (id, title, extra = {}) => ({ id, t: title, needs: [], soft: [], done: false, goal: false, cat: null, prio: 0, created: now, doneAt: null, ...extra });
 const list = [
  task('g1', 'Stellen anschreiben für Kundenakquise', { goal: true, cat: 'arbeit', area: 'akq', needs: ['a', 'b'] }),
  task('a', 'Liste an Stellen anlegen', { needs: ['c', 'desk'] }),
  task('c', 'Ort festlegen, wo die Liste entsteht', { today: true }),
  task('b', 'Text überlegen', { soft: ['ex'] }),
  task('ex', 'Zwei Beispiel-Anschreiben ansehen'),
  task('g2', 'Newsletter starten', { goal: true, cat: 'arbeit', area: 'akq', needs: ['n1'], backlog: true }),
  task('n1', 'Thema der ersten Ausgabe festlegen', { backlog: true }),
  task('g5', 'Rechnungen für November schreiben', { goal: true, cat: 'arbeit', area: 'fin', needs: ['r1'] }),
  task('r1', 'Stunden aus dem Kalender zusammenzählen'),
  task('g8', 'Mails auf null bringen', { goal: true, cat: 'arbeit', area: 'orga' }),
  task('desk', 'Schreibtisch freiräumen'),
  task('g3', 'Keller entrümpeln', { goal: true, cat: 'privat', area: 'haus', needs: ['k1', 'k2'] }),
  task('k1', 'Sperrmüll-Termin holen', { today: true }),
  task('k2', 'Kisten besorgen', { done: true, doneAt: now - 864e5 }),
  task('g4', 'Ein Bild malen', { goal: true, cat: 'hobby', needs: ['desk', 'f1'] }),
  task('f1', 'Farben besorgen')
 ];
 const tasks = {};
 list.forEach(t => { tasks[t.id] = t; });
 return {
  name: 'Testliste', tasks,
  cats: [
   { id: 'arbeit', name: 'Arbeit', color: '#5b8def', sammlung: true, subs: [{ id: 'akq', name: 'Akquise' }, { id: 'fin', name: 'Finanzen' }, { id: 'orga', name: 'Orga' }] },
   { id: 'privat', name: 'Privat', color: '#e0a03a', sammlung: true, subs: [{ id: 'haus', name: 'Haushalt' }, { id: 'ges', name: 'Gesundheit' }] },
   { id: 'hobby', name: 'Hobby', color: '#9b7fd1', sammlung: true, subs: [] }
  ],
  openCat: 'arbeit', view: 'jetzt', inbox: [], anim: false, day: midnight.getTime() + shift, format: 1
 };
}
// Lädt die App mit den Testdaten
async function freshApp() {
 localStorage.setItem(KEY, JSON.stringify(testData()));
 await loadApp();
}
// Eine Sicherungsdatei „hochladen“, als hätte man sie in der Dateiauswahl gewählt
async function importText(text, name = 'sicherung.json') {
 const input = $('#importFile');
 const transfer = new win.DataTransfer();
 transfer.items.add(new win.File([text], name, { type: 'application/json' }));
 input.files = transfer.files;
 input.dispatchEvent(new Event('change', { bubbles: true }));
 await sleep(150);
}

const tests = [];
const test = (name, fn) => tests.push({ name, fn });

test('Erster Start zeigt die Beispielkarte, zwei Tabs und Machbar an', async () => {
 localStorage.removeItem(KEY);
 await loadApp();
 expect($$('[data-view]').length === 2, 'Es gibt nicht zwei Tabs');
 expect($('.cat.open .mswitch[aria-checked="true"]'), 'Schalter „Machbar“ ist beim ersten Start nicht an');
 expect($('#acc .cat.open'), 'Kein Bereich aufgeklappt');
 expect($$('#acc .card').length > 0, 'Keine Karte in „Machbar“');
});
test('Jeder Bereich hat eine „Sammlung“ ohne Zeitnah und Backlog, mit Auge zum Ausblenden', async () => {
 const col = $$('#cols > .col')[0];
 expect(col.querySelector('.sammlung') && !col.querySelector('.zlabel') && !col.querySelector('.blsec'), 'Sammlung hat Zeitnah oder Backlog');
 await click(col.querySelector('.ins[data-act="insroot"]'));
 const input = $('.insrowroot .tinput');
 input.value = 'Schnell notiert';
 await pressKey(input, 'Enter');
 if ($('.insrowroot .tinput')) await pressKey($('.insrowroot .tinput'), 'Escape');
 expect(saved().cats.every(b => b.subs[0].inbox && b.subs[0].name === 'Sammlung'), 'Nicht jeder Bereich hat eine Sammlung');
 const sammlungId = saved().cats[0].subs[0].id;
 const note = Object.values(saved().tasks).find(t => t.t === 'Schnell notiert');
 expect(note && note.area === sammlungId && !note.backlog, 'Notiz liegt nicht in der Sammlung');
 const columns = $$('#cols > .col').length;
 await click('.subtabs .eye');
 expect(saved().cats[0].subs[0].hidden && $$('#cols > .col').length === columns - 1, 'Auge blendet die Sammlung nicht aus');
 expect($('.subtabs .tab.off'), 'Ausgeblendeter Knopf fehlt');
 await click('.subtabs .tab.off');
 expect(!saved().cats[0].subs[0].hidden && $$('#cols > .col').length === columns, 'Sammlung kommt nicht wieder');
 // Gelöscht bleibt gelöscht
 await click(`[data-act="editsub"][data-s="${sammlungId}"]`);
 await click('#modal [data-v="del"]');
 await click('#modal [data-v="yes"]');
 await loadApp();
 expect(!saved().cats[0].subs.some(k => k.inbox), 'Gelöschte Sammlung ist wieder da');
});
test('Testliste laden', async () => {
 await freshApp();
 expect($$('#acc .card').length > 3, 'Karten der Testliste fehlen');
 expect(saved().format === 1, 'Datenformat ist nicht 1');
});
test('Alte Daten aus dem Tab „Machbar“ öffnen die Übersicht mit Schalter an', async () => {
 expect($('[data-view="baum"]').getAttribute('aria-pressed') === 'true', 'Tab „Übersicht“ ist nicht gedrückt');
 expect($('.mswitch').getAttribute('aria-checked') === 'true', 'Schalter „Machbar“ ist nicht an');
 expect($('#acc .card') && !$('#acc .tree'), 'Es werden nicht die machbaren Karten gezeigt');
});
test('Übersicht und Heute wechseln, Schalter „Machbar“ an und aus', async () => {
 await click('[data-view="heute"]');
 expect($('#daylist'), 'Heute-Liste fehlt');
 expect(!$('.mswitch'), 'Schalter „Machbar“ darf in Heute nicht stehen');
 await click('[data-view="baum"]');
 expect($('.mswitch[aria-checked="true"]') && $('#acc .card'), 'Nach Heute ist der Schalter „Machbar“ nicht mehr an');
 await click('.mswitch');
 expect($('#acc .tree') && $('.mswitch').getAttribute('aria-checked') === 'false', 'Schalter aus zeigt nicht wieder alles');
 expect(saved().machbar === false && saved().view === 'baum', 'Schalter aus wurde nicht gespeichert');
 await click('[data-view="heute"]');
 await click('[data-view="baum"]');
 expect($('#acc .tree'), 'Nach Heute ist der Schalter „Machbar“ nicht mehr aus');
 await click('.mswitch');
 expect($('#acc .card') && !$('#acc .tree'), 'Schalter an zeigt nicht nur das Machbare');
});
test('Schalter „Machbar“ bleibt an, wenn man einen anderen Bereich aufklappt', async () => {
 await click('.catbar[data-cat="privat"]');
 expect($('.cat.open .mswitch[aria-checked="true"]'), 'Schalter ist im anderen Bereich nicht an');
 expect($('#acc .card[data-id="k1"]'), 'Machbare Karte in Privat fehlt');
 await click('.catbar[data-cat="arbeit"]');
});
test('Reihenfolge der Tabs: Übersicht, Heute', async () => {
 const order = $$('[data-view]').map(b => b.dataset.view).join(',');
 expect(order === 'baum,heute', 'Reihenfolge ist ' + order);
});
test('Kategorie-Navigation: alle Kategorien sichtbar, Klick springt zur Spalte', async () => {
 const tabs = $$('.subtabs .tab[data-i]');
 expect(tabs.length === 3, 'Nicht alle drei Kategorien als Knopf da');
 expect(tabs.every(t => t.offsetParent !== null), 'Ein Kategorie-Knopf ist versteckt');
 const nav = $('.subtabs');
 expect(nav.scrollWidth <= nav.clientWidth + 1, 'Kategorie-Knöpfe ragen seitlich heraus statt umzubrechen');
 await click(tabs[2]);
 expect(tabs[2].getAttribute('aria-current') === 'true', 'Geklickte Kategorie ist nicht markiert');
 const cols = $('#cols');
 const column = cols.children[2];
 expect(column.classList.contains('jump'), 'Spalte leuchtet nicht auf');
 const visible = column.getBoundingClientRect().left < cols.getBoundingClientRect().right - 20;
 expect(visible, 'Zur Spalte wurde nicht gesprungen');
 await click(tabs[0]);
 await sleep(150);
 expect(cols.scrollLeft < 5, 'Zurück zur ersten Spalte ging nicht');
});
test('Handy: nichts ragt seitlich heraus, Schnelleingabe statt Pfeilen an den Spalten, kein „zeitnah“', async () => {
 frame.style.width = '360px';
 await sleep(200);
 try {
  expect(doc.documentElement.scrollWidth <= win.innerWidth + 1, 'Seite ist breiter als der Bildschirm');
  expect($('.subtabs').offsetParent === null, 'Kategorie-Knöpfe sind am Handy noch sichtbar');
  expect(!/zeitnah/i.test($('.cat.open').innerText), 'Wort „zeitnah“ steht noch im Bereich');
  expect($('.mswitch .sm').offsetParent !== null && $('.mswitch .sm').textContent === 'Nur Startklares', 'Schalter heißt nicht kurz „Nur Startklares“');
  expect($('.cathead [data-act="editcat"]').offsetParent === null, 'Stift am Bereichsnamen ist am Handy noch sichtbar');
  expect(!$('.colarrow') || $('.colarrow').offsetParent === null, 'Pfeile neben den Spalten sind noch da');
  expect($('.dock .plus').offsetParent === null && $('#qin').offsetParent !== null, 'Unten steht noch der Knopf statt der Eingabezeile');
  expect(!$$('#acc .insroot').some(x => x.offsetParent !== null), '„+“-Linie für neue Karten zwischen den Karten ist noch sichtbar');
  const cols = $('#cols');
  const prev = $('.qarrow.qprev'), next = $('.qarrow.qnext');
  expect(prev.classList.contains('off') && !next.classList.contains('off'), 'Linker Pfeil am Anfang nicht ausgegraut');
  await click(next);
  await sleep(150);
  expect(cols.children[1].classList.contains('jump'), 'Runder Pfeil springt nicht zur nächsten Kategorie');
  // Rechtsklick (wie langes Drücken): Menü mit allen Kategorien
  next.dispatchEvent(new win.MouseEvent('contextmenu', { bubbles: true, cancelable: true }));
  await sleep(60);
  const items = $$('.ctxmenu [data-act="gocol"]');
  const real = $$('#cols > .col:not(.coladd)');
  expect(items.length === real.length, 'Menü zeigt nicht alle Kategorien');
  await click(items.at(-1));
  await sleep(150);
  expect(real.at(-1).classList.contains('jump') && !$('.ctxmenu'), 'Menü springt nicht zur Kategorie');
  expect(next.classList.contains('off'), 'Rechter Pfeil an der letzten Kategorie nicht ausgegraut');
  // Leere Spalte am Ende mit „+ Neue Kategorie“
  const add = $('#cols > .coladd [data-act="newsub"]');
  expect(add && add.offsetParent !== null, 'Leere Spalte „+ Neue Kategorie“ fehlt');
  // 1.0.49: Plus oben, gleicher Abstand links, oben, rechts
  {
   const c = add.closest('.coladd').getBoundingClientRect(), p = add.querySelector('span').getBoundingClientRect();
   const l = p.left - c.left, r = c.right - p.right, t = p.top - c.top;
   expect(Math.abs(l - r) < 3 && Math.abs(t - l) < 3, `Plus nicht oben mit gleichem Abstand (links ${l|0}, oben ${t|0}, rechts ${r|0})`);
  }
  await click(add);
  expect(modalOpen(), '„+ Neue Kategorie“ öffnet kein Popup');
  await click('#modal [data-v=""]');
  // 1.0.40: Kopf lange drücken = Popup mit Name, Farbe und „Bereich löschen“ (fragt nach)
  expect(!$('.cathead .cattog') || $('.cathead .cattog').offsetParent === null, 'Pfeil rechts im Bereichskopf ist noch da');
  expect($('.cdot svg') && $('.cdot').offsetParent !== null, 'Pfeil steckt nicht im farbigen Kreis');
  const holdHead = async () => {
   const r = $('.cname').getBoundingClientRect();
   $('.cname').dispatchEvent(new win.PointerEvent('pointerdown', { bubbles: true, clientX: r.left + 5, clientY: r.top + 5, pointerType: 'touch' }));
   await sleep(550);
   win.document.dispatchEvent(new win.PointerEvent('pointerup', { bubbles: true }));
   await sleep(400);  // Klick beim Loslassen wird kurz verschluckt
  };
  await holdHead();
  expect(modalOpen() && $('#modal [name=name]') && $('#modal [data-v="del"]'), 'Langes Drücken auf den Kopf öffnet kein Popup mit Name und Löschen');
  await click('#modal [data-v="del"]');
  expect(modalOpen(), 'Keine Sicherheitsfrage vor dem Löschen des Bereichs');
  await click('#modal [data-v=""]');
  await sleep(60);
  expect(saved().cats.some(b => b.id === 'arbeit'), 'Bereich wurde trotz Abbrechen gelöscht');
  await holdHead();
  $('#modal [name=name]').value = 'Arbeit 2';
  await click('#modal [data-v="ok"]');
  await sleep(60);
  expect(saved().cats.find(b => b.id === 'arbeit').name === 'Arbeit 2', 'Neuer Name wurde nicht gespeichert');
  await holdHead();
  $('#modal [name=name]').value = 'Arbeit';
  await click('#modal [data-v="ok"]');
  await sleep(60);
  // Kreis antippen = zuklappen, auf der Leiste wieder aufklappen
  await sleep(650);  // direkt nach dem langen Drücken zählt ein Tippen nicht
  await click('.cdot');
  await sleep(60);
  expect(!$('.cat.open[aria-label="Arbeit"]') && $('.catbar .cball'), 'Kreis klappt den Bereich nicht zu');
  await click('.catbar[data-cat="arbeit"]');
  await sleep(60);
  expect($('.cat.open[aria-label="Arbeit"]'), 'Bereich lässt sich nicht wieder aufklappen');
  await click('[data-act="newcat"]');
  const box = $('#modal .box').getBoundingClientRect();
  expect(box.left >= 0 && box.right <= win.innerWidth + 1, 'Popup ist breiter als der Bildschirm');
  await click('#modal [data-v=""]');
  if (modalOpen()) { win.document.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape' })); await sleep(60); }
 } finally {
  win.eval('goToColumn(0)'); await sleep(150);
  frame.style.width = '';
  await sleep(200);
 }
});
test('Handy: In „Heute“ ohne Pfeile, das „+“ fragt nach dem Bereich und legt in dessen Sammlung an', async () => {
 frame.style.width = '360px';
 await sleep(200);
 try {
  await click('[data-view="heute"]');
  await sleep(100);
  expect(!$$('.qarrow').some(a => a.offsetParent !== null), 'Pfeile stehen in „Heute“ noch neben dem Feld');
  $('#qin').value = 'Heute-Test';
  await click('.qadd');
  const choices = $$('.ctxmenu [data-act="qheute"]');
  expect(choices.length === saved().cats.length, 'Beim „+“ erscheint keine Auswahl der Bereiche');
  const target = saved().cats[0];
  await click(choices[0]);
  await sleep(60);
  const made = Object.values(saved().tasks).find(t => t.t === 'Heute-Test');
  const sammlung = target.subs.find(k => k.inbox);
  expect(made && made.today && made.cat === target.id && made.area === (sammlung ? sammlung.id : null), 'To-Do steht nicht für heute in der Sammlung des gewählten Bereichs');
  await undoLast();
 } finally {
  await click('[data-view="baum"]');
  frame.style.width = '';
  await sleep(200);
 }
});
test('Menü ⋯: Über diese App, Datensicherung und Animationen', async () => {
 await click('[data-act="menu"]');
 expect($('.ctxmenu [data-act="about"]') && $('.ctxmenu [data-act="backup"]') && $('.ctxmenu [data-act="anim"]'), 'Menü hat nicht alle Einträge');
 const before = saved().anim;
 await click('.ctxmenu [data-act="anim"]');

 expect(modalOpen() && /Tracking/.test($('#modal').textContent) && !/Datenformat/.test($('#modal').textContent), 'App-Infos fehlen oder zeigen noch technische Details');

 expect(!$('.foot').textContent.trim(), 'Hinweis unter den Bereichen steht noch da');

test('Handy: Schnelleingabe legt in der sichtbaren Spalte an, ausgefahren auch woanders und ins Backlog', async () => {
 frame.style.width = '360px';
 await sleep(200);
 try {
  const fin = $$('#cols > .col').findIndex(c => c.getAttribute('aria-label') === 'Finanzen');
  win.eval(`goToColumn(${fin})`); await sleep(150);
  expect($('#qin').placeholder === 'in „Finanzen“', 'Hinweistext nennt die sichtbare Spalte nicht');
  expect(!$('#qlabel'), 'Schild über der Eingabe ist noch da');
  const qin = $('#qin');
  qin.value = 'Schnell 1';
  await pressKey(qin, 'Enter');
  qin.value = 'Schnell 2';
  await click('.qadd'); // „+“ links im Feld statt Enter
  const tasks = Object.values(saved().tasks);
  const s1 = tasks.find(t => t.t === 'Schnell 1'), s2 = tasks.find(t => t.t === 'Schnell 2');
  expect(s1 && s2 && s1.cat === 'arbeit' && s1.area === 'fin' && !s1.backlog, 'To-Do liegt nicht in Arbeit · Finanzen');
  expect(qin.value === '' && doc.activeElement === qin, 'Feld ist nach Enter nicht leer und bereit');
  const order = $$('.col[aria-label="Finanzen"] .card').map(c => c.dataset.id);
  expect(order.at(-1) === s2.id && order.at(-2) === s1.id, 'Neue To-Dos stehen nicht unten in der Reihenfolge des Tippens');
  // Ausfahren: Ort und Backlog selbst wählen
  await click('.qmore');
  expect($('#qbar').classList.contains('open') && $('#qopts [data-pick=cat]'), 'Einsortier-Optionen fahren nicht aus');
  const bereich = $('#qopts [data-pick=cat]');
  bereich.value = 'privat';
  bereich.dispatchEvent(new Event('change', { bubbles: true }));
  $('#qopts [name=bl]').checked = true;
  $('#qopts [name=bl]').dispatchEvent(new Event('change', { bubbles: true }));
  await sleep(30);
  expect($('#qin').placeholder === 'in „Haushalt“ · Backlog', 'Hinweistext zeigt nicht Haushalt · Backlog');
  qin.value = 'Schnell Privat';
  await pressKey(qin, 'Enter');
  const sp = Object.values(saved().tasks).find(t => t.t === 'Schnell Privat');
  expect(sp && sp.cat === 'privat' && sp.area === 'haus' && sp.backlog, 'To-Do liegt nicht in Privat · Haushalt · Backlog');
  await click('.qmore');
  expect(!$('#qbar').classList.contains('open'), 'Optionen fahren nicht wieder ein');
  await undoLast();
  expect(!Object.values(saved().tasks).some(t => t.t === 'Schnell Privat'), 'Rückgängig nimmt das Anlegen nicht zurück');
 } finally {
  win.eval('goToColumn(0)'); await sleep(150);
  frame.style.width = '';
  await sleep(200);
 }
});
test('Handy: Popup „Neues To-Do“ – Enter legt ein weiteres To-Do an, „+ davor/danach“', async () => {
 frame.style.width = '360px';
 await sleep(200);
 try {
  const before = Object.keys(saved().tasks).length;
  const orga = $$('#cols > .col').findIndex(c => c.getAttribute('aria-label') === 'Orga');
  win.eval(`goToColumn(${orga})`); await sleep(150);
  // Weg über die Schnelleingabe: ausfahren → „Mehrere mit davor/danach …“
  await click('.qmore');
  await click('#qopts [data-act="qfull"]');
  expect(modalOpen() && $('#modal .mcard'), 'Popup für mehrere To-Dos geht nicht auf');
  const rows = () => $$('#modal .mrow');
  const inp = n => rows()[n].querySelector('input');

// Zieht ein Element am Griff zu (x, y) – wie mit Maus oder Finger
async function dragTo(grip, x, y) {
 const from = grip.getBoundingClientRect();
 const at = (type, px, py, target = win) => target.dispatchEvent(new win.PointerEvent(type, { bubbles: true, clientX: px, clientY: py, pointerId: 1, pointerType: 'mouse' }));
 at('pointerdown', from.x + 5, from.y + 5, grip);
 at('pointermove', from.x + 5, from.y + 20);
 at('pointermove', x, y);
 at('pointerup', x, y);
 await sleep(400); // direkt nach dem Ziehen ignoriert die App Klicks kurz
}

  expect(bg && bg !== 'transparent' && !/rgba\(.*, 0\)$/.test(bg), 'Schnelleingabe hat keinen deckenden Hintergrund');
  const nb = win.getComputedStyle(next).backgroundColor;
  expect(nb === 'transparent' || /rgba\(.*, 0\)$/.test(nb), 'Pfeil hat noch einen Kreis');
  const bereich = saved().cats.find(c => c.id === saved().openCat);
  const probe = doc.createElement('i'); probe.style.color = bereich.color; doc.body.append(probe);
  const want = win.getComputedStyle(probe).color; probe.remove();
  if (!next.classList.contains('off')) expect(win.getComputedStyle(next).color === want, 'Pfeil hat nicht die Farbe des Bereichs');
  expect(bar.getBoundingClientRect().left <= field.getBoundingClientRect().left - 30, 'Fläche reicht nicht hinter die Pfeile');
 } finally {
  frame.style.width = '';
  await sleep(150);
 }
});

// 1.0.51: „Nur Startklares“ zeigt nirgends ein To-Do, vor dem noch etwas offen ist, auch nicht in der Sammlung
// und im Backlog. Stattdessen steht dort das Unter-To-Do, mit dem man anfangen kann.
async function sammlungMitUnterToDo() {
 const d = saved();
 const t = (id, title, extra) => ({ id, t: title, needs: [], soft: [], done: false, goal: false, cat: null, prio: 0, created: Date.now(), doneAt: null, ...extra });
 d.cats[0].subs.unshift({ id: 'sam', name: 'Sammlung', icon: 'inbox', inbox: true });
 // Karten oben in einer Spalte sind immer Ziele (goal: true), so legt die App sie an
 d.tasks.h = t('h', 'Haupt-To-Do', { goal: true, cat: 'arbeit', area: 'sam', needs: ['u'] });
 d.tasks.u = t('u', 'Unter-To-Do', { needs: ['uu'], prio: 1 });
 d.tasks.uu = t('uu', 'Unter-Unter-To-Do', { prio: 2 });
 d.tasks.hs = t('hs', 'Haupt mit Hilfe', { goal: true, cat: 'arbeit', area: 'sam', soft: ['us'] });
 d.tasks.us = t('us', 'Hilfe-To-Do', {});
 win.localStorage.setItem(KEY, JSON.stringify(d));
 await loadApp();
}

// 1.0.53: Der aufgeklappte Bereich steht oben, sonst gilt die gespeicherte Reihenfolge. Umsortieren per Ziehen.
const bereichOrder = () => [...$('#acc').children].filter(el => el.matches('.cat.open, .catbar:not(.new)'))
 .map(el => el.matches('.catbar') ? el.dataset.cat : el.querySelector('.cathead [data-act="opencat"]').dataset.cat).join(',');
const rowOf = id => $(`#acc .catbar[data-cat="${id}"]`) || $(`#acc .cathead [data-act="opencat"][data-cat="${id}"]`).closest('.cat');
function pointer(el, type, x, y, pointerType = 'mouse') {
 el.dispatchEvent(new win.PointerEvent(type, { bubbles: true, cancelable: true, composed: true, clientX: x, clientY: y, pointerType, isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1 }));
}
// Zieht `fromEl` (an seiner Mitte angefasst) senkrecht auf die Höhe y
async function dragBereichTo(fromEl, y, pointerType = 'mouse', holdMs = 0) {
 const box = fromEl.getBoundingClientRect();
 const x = box.left + 40, y0 = box.top + box.height / 2;
 pointer(fromEl, 'pointerdown', x, y0, pointerType);
 if (holdMs) await sleep(holdMs);
 for (let i = 1; i <= 6; i++) { pointer(doc.body, 'pointermove', x, y0 + (y - y0) * i / 6, pointerType); await sleep(20); }
 pointer(doc.body, 'pointerup', x, y, pointerType);
 await sleep(120);
}
test('Aufgeklappter Bereich steht oben, zugeklappt gilt die gespeicherte Reihenfolge', async () => {
 await freshApp();
 expect(bereichOrder() === 'arbeit,privat,hobby', 'Start-Reihenfolge ist ' + bereichOrder());
 await click('.catbar[data-cat="hobby"]');
 expect(bereichOrder() === 'hobby,arbeit,privat', 'Hobby steht aufgeklappt nicht oben: ' + bereichOrder());
 expect(saved().cats.map(c => c.id).join(',') === 'arbeit,privat,hobby', 'Aufklappen hat die gespeicherte Reihenfolge verändert');
 await click('.cat.open .cathead [data-act="opencat"]');
 expect(saved().openCat === null, 'Bereich ist nicht zugeklappt');
 expect(bereichOrder() === 'arbeit,privat,hobby', 'Alle zu: Reihenfolge ist nicht wie angelegt: ' + bereichOrder());
});

 const arbeit = rowOf('arbeit');
 await dragBereichTo(arbeit, rowOf('hobby').getBoundingClientRect().bottom + 4);
 expect(saved().cats.map(c => c.id).join(',') === 'privat,hobby,arbeit', 'Arbeit ist nicht ans Ende gezogen: ' + saved().cats.map(c => c.id));

 // Hobby ganz nach oben
 await dragBereichTo(rowOf('hobby'), rowOf('privat').getBoundingClientRect().top + 3);
 expect(saved().cats.map(c => c.id).join(',') === 'hobby,privat,arbeit', 'Hobby ist nicht nach oben gezogen: ' + saved().cats.map(c => c.id));
 await undoLast();

});

 await sleep(60);
 await dragBereichTo(rowOf('hobby'), rowOf('privat').getBoundingClientRect().top + 3);

test('Handy: lange drücken und loslassen = Popup, lange drücken und ziehen = umsortieren', async () => {
 await freshApp();
 frame.style.width = '360px';
 await sleep(200);
 try {
  await click('.cat.open .cathead .cdot');   // alle zu
  const bar = rowOf('privat');
  const box = bar.getBoundingClientRect();
  pointer(bar, 'pointerdown', box.left + 60, box.top + 20, 'touch');
  await sleep(600);
  expect(!modalOpen(), 'Popup geht schon vor dem Loslassen auf');
  pointer(doc.body, 'pointerup', box.left + 60, box.top + 20, 'touch');
  await sleep(100);
  expect(modalOpen() && $('#modal h2').textContent === 'Bereich bearbeiten', 'Loslassen ohne Bewegung öffnet nicht „Bereich bearbeiten“');
  await click('#modal [data-v=""]') .catch(() => {});
  if (modalOpen()) { $('#modal').hidden = true; }
  await sleep(500);
  // Kurz wischen (ohne Halten) ist Scrollen, kein Ziehen
  await dragBereichTo(rowOf('privat'), rowOf('hobby').getBoundingClientRect().bottom + 4, 'touch', 0);
  expect(saved().cats.map(c => c.id).join(',') === 'arbeit,privat,hobby', 'Wischen ohne Halten hat umsortiert');
  // Halten, dann ziehen
  await dragBereichTo(rowOf('privat'), rowOf('hobby').getBoundingClientRect().bottom + 4, 'touch', 600);
  expect(saved().cats.map(c => c.id).join(',') === 'arbeit,hobby,privat', 'Halten und Ziehen sortiert nicht um: ' + saved().cats.map(c => c.id));
  expect(!modalOpen(), 'Nach dem Ziehen ist ein Popup offen');
  expect(saved().openCat === null, 'Ziehen hat einen Bereich aufgeklappt');
 } finally {
  frame.style.width = '';
  await sleep(150);
 }
});

document.getElementById('run').onclick = async () => {
 const own = localStorage.getItem(KEY); // eigene Liste sichern
 results.innerHTML = '';
 let failed = 0;
 try {
  for (const t of tests) {
   const li = document.createElement('li');
   results.append(li);
   try {
    await t.fn();
    li.className = 'ok';
    li.textContent = '✓ ' + t.name;
   } catch (e) {
    failed++;
    li.className = 'fail';
    li.innerHTML = '✗ ' + t.name + '<small></small>';
    li.querySelector('small').textContent = e.message;
   }
  }
 } finally {
  frame.src = 'about:blank';
  await sleep(100);
  if (own === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, own); // eigene Liste zurück
 }
 const summary = document.getElementById('summary');
 summary.textContent = failed ? `${failed} von ${tests.length} Tests fehlgeschlagen.` : `Alle ${tests.length} Tests bestanden.`;
 summary.className = failed ? 'fail' : 'ok';
};
