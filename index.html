<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meine Power-Liste</title>
<meta name="description" content="Ruhige To-Do-Liste für neurodivergente Menschen. Alles bleibt auf diesem Gerät.">
<meta name="theme-color" content="#f4f5f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Power-Liste">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
 <header>
  <input class="name" id="name" aria-label="Name der Liste" autocomplete="off">
  <span id="inboxSlot"></span>
  <button class="iconbtn" data-act="menu" aria-label="Einstellungen"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
 </header>
 <div class="switch" role="group" aria-label="Ansicht">
  <button data-view="baum">Übersicht</button><button data-view="jetzt">Machbar</button><button data-view="heute">Heute</button>
 </div>
 <main id="acc"></main>
 <p class="foot">Alles bleibt nur auf diesem Gerät. Kein Konto, kein Tracking.</p>
</div>
<div class="dock"><button class="plus" data-act="add"><span>+</span> Neues To-Do</button></div>
<div id="focus" hidden></div>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="js/app.js"></script>
</body>
</html>
